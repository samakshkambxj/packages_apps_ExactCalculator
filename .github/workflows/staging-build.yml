name: ExactCalculator Staging

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Find generated APK
        run: |
          echo "Searching for generated APK..."
          find . -type f -name "*.apk" -print
          mkdir -p ./artifacts
          cp $(find . -type f -path "*build/outputs/apk/debug/*.apk" | head -1) ./artifacts/MaxxOS-ExactCalculator.apk
          ls -la ./artifacts

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MaxxOS-ExactCalculator-staging-${{ github.run_number }}
          path: ./artifacts/MaxxOS-ExactCalculator.apk
          if-no-files-found: error
          retention-days: 14
